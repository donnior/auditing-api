server:
    servlet:
      context-path: /auditing-api

spring:
  application:
    name: xcauditing

  datasource:
    url: "jdbc:postgresql://127.0.0.1:5432/xcauditing"
    username: "postgres"
    password: ""

  jpa:
    hibernate:
      ddl-auto: none


  flyway:
    enabled: true
    table: xc_flyway_schema_history
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: true

  quartz:
    job-store-type: jdbc
    overwrite-existing-jobs: true
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    property-naming-strategy: SNAKE_CASE
    time-zone: GMT+8
    deserialization:
      fail_on_unknown_properties: false

logging:
  pattern:
    console: "%clr(%d{MM-dd HH:mm:ss}){yellow} %clr(%-5level) [%thread] %clr(%logger{36}){blue} - %msg%n"
  level:
    com.xingcanai.csqe.auditing: DEBUG

llm:
  provider:
    coze:
      app-id: 1185261263158
      apikey: sat_lHVT8MBuo0hC71uO5r6BtuW8zbJES1gmWUprWX4Lfq4Qli6fEpThfmrHSAOWXSWT
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:true}
      reasoning-effort: ${DEEPSEEK_REASONING_EFFORT:high}
      temperature: ${DEEPSEEK_TEMPERATURE:0.2}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:32768}
      timeout: ${DEEPSEEK_TIMEOUT:15m}
      max-retries: ${DEEPSEEK_MAX_RETRIES:2}
      retry-delay: ${DEEPSEEK_RETRY_DELAY:1s}

sales-speech-analysis:
  prompt-version: v1.3.0
  prompt-resource: classpath:prompts/sales-speech-analysis-v1.3.0.md
  stale-after: 20m
  zone-id: Asia/Shanghai
  executor-concurrency: 2
  executor-queue-capacity: 20

security:
  jwt:
    # 生产环境请替换成强随机密钥（至少 32 字节），避免泄露
    secret: "change-me-change-me-change-me-change-me-2026"
    # 7 天（秒）
    ttl-seconds: 604800
